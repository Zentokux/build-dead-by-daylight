<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Builds Sobreviviente</title>
<meta name="description" content="Builds de 4 ventajas para Sobreviviente en Dead by Daylight, parche 10.2.1, en español.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at top, #2a0f14 0%, #0d0a0c 55%, #050405 100%);
  color: #ece6e7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding: 2rem 1rem;
}
header { text-align: center; max-width: 820px; margin: 0 auto 1.6rem; }
header h1 {
  font-size: clamp(2rem, 5vw, 3.2rem);
  color: #e11d48;
  text-shadow: 0 2px 22px rgba(225, 29, 72, .45);
  letter-spacing: .04em;
  margin-bottom: .8rem;
}
.badges { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; }
.badge {
  background: #1d1517; border: 1px solid #3a2a2e; padding: .3rem .8rem;
  border-radius: 999px; font-size: .85rem; color: #d8cdd0;
}
.badge.ok { border-color: #22c55e; color: #22c55e; }
main { max-width: 1100px; margin: 0 auto; }
.filtros { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
.filtros button {
  background: #1d1517; color: #ece6e7; border: 1px solid #3a2a2e; border-radius: 999px;
  padding: .45rem 1.1rem; font-size: .9rem; cursor: pointer;
}
.filtros button.on { background: #e11d48; border-color: #e11d48; color: #fff; font-weight: 700; }
table { width: 100%; border-collapse: collapse; background: #140f11; border-radius: 12px; overflow: hidden; font-size: .88rem; }
th, td { padding: .55rem .6rem; text-align: left; border-bottom: 1px solid #2a1f22; vertical-align: middle; }
th { background: #1d1517; color: #fca5a5; font-weight: 600; }
.ct { color: #fca5a5; }
.bn { font-weight: 700; color: #fff; }
.sub { color: #8f8285; font-size: .78rem; }
.ventajas { white-space: nowrap; }
.ventajas img { width: 38px; height: 38px; vertical-align: middle; cursor: help; border-radius: 6px; }
.ventajas img:hover, .ventajas img.on { background: #3a2a2e; }
#tip {
  position: fixed; z-index: 10; max-width: 300px; pointer-events: none; display: none;
  background: #0b0809; border: 1px solid #e11d48; border-radius: 10px;
  padding: .7rem .85rem; font-size: .85rem; line-height: 1.45; color: #ddd3d5;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
}
#tip.show { display: block; }
#tip .nm { font-weight: 700; color: #fff; font-size: .95rem; }
#tip .en { color: #8f8285; font-size: .75rem; margin-bottom: .35rem; }
#tip b { color: #fff; }
#tip .meta { color: #a8999c; font-size: .75rem; margin-top: .35rem; }

@media (max-width: 760px) {
  th, td { padding: .5rem .4rem; }
  .ventajas { white-space: normal; }
  .ventajas img { width: 34px; height: 34px; }
}
</style>
</head>
<body>
<header>
  <h1>Builds de Sobreviviente</h1>
  <div class="badges" id="badges"></div>
</header>

<main>
  <div class="filtros" id="filtros">
    <button data-m="todas" class="on">Todas</button>
    <button data-m="solo">Solitario</button>
    <button data-m="coop">Coop</button>
  </div>
  <table id="elige"></table>
</main>
<div id="tip"></div>

<script src="datos.js"></script>
<script>
const P = window.PERKS, M = window.DBD_META;
const ico = p => `icons/perks/${p.icon}`;
const MODO = { solo: 'Solitario', coop: 'Coop' };

document.getElementById('badges').innerHTML = `
  <span class="badge ok">Parche ${M.parche} (${M.fechaParche})</span>
  <span class="badge ok">Validado ${M.validado}</span>`;

const tabla = document.getElementById('elige');
tabla.innerHTML = `
  <tr><th>Si el asesino…</th><th>Lleva</th><th>Ventajas</th></tr>` +
  window.BUILDS.map(b => `
  <tr class="fila" data-modo="${b.modo}">
    <td class="ct">${(b.contra || [b.tag]).join(', ')}</td>
    <td><span class="bn">${b.nombre.replace(/^(Solitario|Coop): (.)/, (_, m, c) => c.toUpperCase())}</span><br><span class="sub">${MODO[b.modo]} · ${b.tag}</span></td>
    <td class="ventajas">${b.perks.map(k => `<img src="${ico(P[k])}" alt="${P[k].es}" data-k="${k}" width="38" height="38" decoding="async">`).join('')}</td>
  </tr>`).join('');

document.querySelectorAll('#filtros button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x === btn));
  const m = btn.dataset.m;
  tabla.querySelectorAll('tr.fila').forEach(s => {
    s.style.display = (m === 'todas' || s.dataset.modo === m) ? '' : 'none';
  });
}));

// Nombre y descripción de la ventaja: al pasar el ratón (PC) o al tocar el icono (móvil)
const tip = document.getElementById('tip');
let activo = null;
const mostrar = img => {
  const p = P[img.dataset.k];
  tip.innerHTML = `<div class="nm">${p.es}</div><div class="en">${p.en} · ${p.dueno.split(' (')[0]}</div>${p.efecto}
    ${p.coste && p.coste !== '—' ? `<div class="meta">${p.coste}</div>` : ''}`;
  tip.classList.add('show');
  const r = img.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - t.width / 2, y = r.bottom + 8;
  x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
  if (y + t.height > window.innerHeight - 8) y = r.top - t.height - 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  if (activo) activo.classList.remove('on');
  activo = img; img.classList.add('on');
};
const ocultar = () => { tip.classList.remove('show'); if (activo) activo.classList.remove('on'); activo = null; };
tabla.addEventListener('mouseover', e => { if (e.target.matches('.ventajas img')) mostrar(e.target); });
tabla.addEventListener('mouseout', e => { if (e.target.matches('.ventajas img')) ocultar(); });
document.addEventListener('click', e => {
  const img = e.target.closest('.ventajas img');
  if (img) mostrar(img); else ocultar();
});
window.addEventListener('scroll', ocultar, { passive: true });
</script>
</body>
</html>
